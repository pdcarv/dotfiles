# General settings
set -g default-shell "/opt/homebrew/bin/zsh"
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# Truecolor and extended keys (CSI u) from Ghostty and other xterm-likes
set -as terminal-features ',xterm-ghostty:RGB:extkeys,xterm*:RGB:extkeys'
set -s extended-keys on

# Prefix setting
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Modern terminal settings
set -g focus-events on
set -sg escape-time 0
set -g mouse on

# Window settings
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
setw -g automatic-rename on

# Notifications
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# Vi mode
set -g mode-keys vi
set -g status-keys vi

# Key bindings
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Better splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enhanced vim-like copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer

# Smart pane switching shared with Neovim (christoomey/vim-tmux-navigator).
# Keys go to the pane when it runs (n)vim or fzf, otherwise tmux switches panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Session management
bind -r ( switch-client -p
bind -r ) switch-client -n
bind -r Tab last-window
bind -r f new-window "zsh -ic 'tm; exit'"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Status bar
set -g status-position top
set -g status-justify left
set -g status-interval 2
set -g status-style bg=default

# Colours are ANSI palette names, so they follow Ghostty's gruvbox light/dark theme.
set -g status-left "#[fg=blue,bold]#S #[fg=brightblack,nobold]| "
set -g status-left-length 20
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g status-right-length 20

# Window status
setw -g window-status-format "#[fg=brightblack] #I #W"
setw -g window-status-current-format "#[fg=blue,bold] #I #W"

# Pane borders
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue

# Message styling
set -g message-style bg=blue,fg=black
